<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Reserve Meet — настройки</title>
  </head>
  <body>
    <div class="wrap options-page">
      <header class="bar">
        <h1>Настройки</h1>
      </header>

      <form id="form" class="actions">
        <label class="field">
          <span>Jitsi-хост</span>
          <input id="jitsiBaseUrl" type="url" required />
        </label>

        <label class="field">
          <span>Ваше имя в Jitsi</span>
          <input id="teacherDisplayName" type="text" />
        </label>

        <label class="check">
          <input id="muteOnOpen" type="checkbox" />
          <span>Выключать камеру и микрофон при входе</span>
        </label>

        <label class="check">
          <input id="helpSound" type="checkbox" />
          <span>Звук, когда ученик поднял руку</span>
        </label>

        <div class="volume" id="help-sound-volume">
          <label class="field">
            <span>Громкость <span id="helpSoundVolumeValue">80%</span></span>
            <input id="helpSoundVolume" type="range" min="0" max="100" step="1" />
          </label>
          <button class="btn ghost" id="help-sound-preview" type="button">Прослушать</button>
        </div>

        <fieldset class="field">
          <legend>Куда открывать вкладки</legend>
          <label class="check">
            <input id="openInNewWindow" name="tabTarget" type="radio" value="new" />
            <span>В новом окне</span>
          </label>
          <label class="check">
            <input id="openInCurrentWindow" name="tabTarget" type="radio" value="current" />
            <span>В текущем окне</span>
          </label>
        </fieldset>

        <details class="templates">
          <summary>Шаблоны сообщений</summary>
          <label class="field">
            <span>Сообщение ученику. Переменные: {name}, {meeting_url}, {profile_url}, {provider}, {date}</span>
            <textarea id="studentTemplate"></textarea>
          </label>
          <label class="field">
            <span>Заголовок, если копируете всех в Slack сразу. Можно оставить пустым.</span>
            <input id="adminHeader" type="text" />
          </label>
          <label class="field">
            <span>Строка Slack: имя как ссылка на профиль и URL комнаты</span>
            <textarea id="adminItemTemplate"></textarea>
          </label>
          <label class="field">
            <span>Ссылка на профиль, если её нет в карточке</span>
            <input id="profileUrlTemplate" type="text" placeholder="{origin}/profile/{user_id}" />
          </label>
        </details>

        <button class="btn primary" type="submit">Сохранить</button>
        <div id="saved" class="muted" hidden>Сохранено</div>
      </form>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
