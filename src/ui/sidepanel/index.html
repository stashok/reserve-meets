<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Reserve Meet</title>
  </head>
  <body>
    <div class="wrap">
      <header class="bar">
        <h1>Reserve Meet</h1>
        <button class="btn ghost" id="refresh" type="button">Обновить</button>
      </header>

      <p id="status" class="status"></p>
      <div id="participants" class="list"></div>

      <form class="manual" id="manual-form">
        <input id="manual-name" type="text" placeholder="Добавить имя" autocomplete="off" />
        <button class="btn" type="submit">Добавить</button>
      </form>

      <div class="actions">
        <button class="btn primary" id="create" type="button" disabled>Создать комнаты</button>
        <button class="btn ghost" id="copy-admin" type="button" hidden>Скопировать всех в Slack</button>
      </div>

      <footer class="bar">
        <a id="open-options" href="#">Настройки</a>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
